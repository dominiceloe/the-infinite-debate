# Production-specific overrides for docker-compose.yml
# Use this with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ✅ PRODUCTION ONLY - Use this in production environments
# ❌ DO NOT use docker-compose.override.yml in production (it auto-merges in dev)
#
# Key differences from dev:
# - No source code volume mounts (code baked into image)
# - Gunicorn with more workers (not runserver)
# - Stricter health checks
# - Production-grade settings

services:
  web:
    # NO volume mounts - code is baked into Docker image
    # This is critical for production isolation
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 4
        --threads 2
        --worker-class gthread
        --timeout 120
        --max-requests 1000
        --max-requests-jitter 50
        --access-logfile -
        --error-logfile -
        --log-level info
      "
    environment:
      - DEBUG=False  # CRITICAL: Disable debug mode in production
      - DJANGO_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  celery:
    # NO volume mounts - code is baked into Docker image
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=4
        --max-tasks-per-child=100
        --time-limit=600
        --soft-time-limit=540
    environment:
      - DEBUG=False
      - DJANGO_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    # Schedule periodic tasks (monthly credit reset, trial expiration, etc.)
    build: .
    container_name: debates_celery_beat
    command: >
      celery -A config beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
      - DJANGO_ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    command: >
      celery -A config flower
        --port=5555
        --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
        --url-prefix=flower
    environment:
      - DJANGO_ENV=production
    # In production, Flower should NOT be publicly exposed
    # Access via SSH tunnel: ssh -L 5555:localhost:5555 user@server
    ports: []  # Remove public port exposure
    restart: unless-stopped

  nginx:
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Use production nginx config (not nginx-dev.conf)
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    # Production database settings
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Consider using managed PostgreSQL (AWS RDS, DigitalOcean Managed DB)
    # For self-hosted, ensure regular backups with backup-database.sh
    restart: unless-stopped

  redis:
    # Production Redis settings
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
    # Named volume for Redis persistence
